# Perf harness on a VITE_PERF=1 build.
#
# Frame time (#526) is report only: it never fails on numbers.
# Gameplay equivalence (#527) does fail: seeded replays must match the
# committed goldens, and on a PR its screenshots must match the base's pixel
# for pixel. A PR also labelled `perf-tolerance` (stories allowed to shift AI
# timing, #537) is held to the base's goldens within ±10% instead. One labelled
# `perf-visual` (an intended look change, e.g. the bitmap font, #534) skips the
# screenshot diff but stays exact on the goldens.
#   - nightly on main: records a baseline artifact.
#   - PR labelled `perf` (and each push while labelled), or manual dispatch:
#     runs the PR head and its base on the same runner, then posts the
#     comparison to the job summary. One runner for both sides keeps
#     runner-to-runner noise out of the delta.
name: Perf

permissions:
    contents: read

on:
    schedule:
        # 04:23 UTC daily, after the nightly E2E run.
        - cron: "23 4 * * *"
    workflow_dispatch:
        inputs:
            sample_frames:
                description: "Sampled frames per scenario (one 1/60s game step each)"
                default: "1200"
    pull_request:
        types: [labeled, synchronize, opened, reopened]

# No cancel-in-progress: adding any other label to a PR starts a run whose job
# is skipped, and it would otherwise cancel a perf run already going.
concurrency:
    group: perf-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

env:
    PERF_SAMPLE_FRAMES: ${{ inputs.sample_frames || '1200' }}
    PERF_SNAPSHOT_DIR: ${{ github.workspace }}/perf-snapshots

jobs:
    perf:
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            # PR runs only: measure the base first, if it already has the harness.
            # Report only: a scenario error must not turn the job red or stop
            # the other side from running.
            - name: Perf (base)
              if: github.event_name == 'pull_request'
              continue-on-error: true
              run: |
                  git worktree add ../base "${{ github.event.pull_request.base.sha }}"
                  cd ../base
                  if [ ! -f playwright.perf.config.ts ]; then
                      echo "Base has no perf harness; skipping base run."
                      exit 0
                  fi
                  npm ci
                  npm run build:perf
                  # A frame-time error is report-only: record snapshots anyway.
                  PERF_OUT_DIR="$GITHUB_WORKSPACE/perf-base" npm run perf:run ||
                      echo "::warning::base frame-time run failed"
                  if [ -f perf/equivalence.spec.ts ]; then
                      PERF_SNAPSHOTS=record npm run perf:equivalence
                  fi

            - name: Perf (head)
              continue-on-error: true
              run: |
                  npm run build:perf
                  npm run perf:run

            # Not continue-on-error: a gameplay change fails the run.
            - name: Gameplay equivalence
              if: ${{ !cancelled() }}
              env:
                  TOLERANCE: ${{ contains(github.event.pull_request.labels.*.name, 'perf-tolerance') }}
                  VISUAL: ${{ contains(github.event.pull_request.labels.*.name, 'perf-visual') }}
              run: |
                  [ -f dist-perf/index.html ] || npm run build:perf
                  if [ "$TOLERANCE" = "true" ] && [ -f ../base/perf/goldens/equivalence.json ]; then
                      # Shifted AI timing moves enemies, so pixels cannot match:
                      # outcomes are checked instead, screenshots skipped.
                      export PERF_EQUIVALENCE=tolerance
                      export PERF_GOLDENS=../base/perf/goldens/equivalence.json
                      echo "Tolerance mode: screenshot diff skipped."
                  elif [ "$VISUAL" = "true" ]; then
                      echo "Visual change: screenshot diff skipped."
                  elif [ -d "$PERF_SNAPSHOT_DIR" ]; then
                      export PERF_SNAPSHOTS=compare
                  elif [ -f ../base/perf/equivalence.spec.ts ]; then
                      echo "::error::base has the equivalence spec but recorded no snapshots"
                      exit 1
                  fi
                  npm run perf:equivalence

            - name: Summary
              if: ${{ !cancelled() }}
              run: |
                  if [ -f perf-base/summary.json ]; then
                      npm run --silent perf:compare -- perf-base/summary.json perf-results/summary.json >> "$GITHUB_STEP_SUMMARY"
                  elif [ -f perf-results/summary.json ]; then
                      npm run --silent perf:compare -- perf-results/summary.json >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: perf-results-${{ github.event_name == 'schedule' && 'nightly' || github.run_id }}
                  path: |
                      perf-results/
                      perf-base/
                      perf-snapshots/
                      test-results/
                  retention-days: 30
