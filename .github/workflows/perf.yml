# Perf harness (#526): frame-time scenarios on a VITE_PERF=1 build.
#
# Report only. It never fails on numbers, so it is not a required check.
#   - nightly on main: records a baseline artifact.
#   - PR labelled `perf` (and each push while labelled), or manual dispatch:
#     runs the PR head and its base on the same runner, then posts the
#     comparison to the job summary. One runner for both sides keeps
#     runner-to-runner noise out of the delta.
name: Perf

permissions:
    contents: read

on:
    schedule:
        # 04:23 UTC daily, after the nightly E2E run.
        - cron: "23 4 * * *"
    workflow_dispatch:
        inputs:
            sample_seconds:
                description: "Sample length per scenario (s)"
                default: "60"
    pull_request:
        types: [labeled, synchronize, opened, reopened]

# No cancel-in-progress: adding any other label to a PR starts a run whose job
# is skipped, and it would otherwise cancel a perf run already going.
concurrency:
    group: perf-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

env:
    PERF_SAMPLE_SECONDS: ${{ inputs.sample_seconds || '60' }}

jobs:
    perf:
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            # PR runs only: measure the base first, if it already has the harness.
            - name: Perf (base)
              if: github.event_name == 'pull_request'
              run: |
                  git worktree add ../base "${{ github.event.pull_request.base.sha }}"
                  cd ../base
                  if [ ! -f playwright.perf.config.ts ]; then
                      echo "Base has no perf harness; skipping base run."
                      exit 0
                  fi
                  npm ci
                  npm run build:perf
                  PERF_OUT_DIR="$GITHUB_WORKSPACE/perf-base" npm run perf:run

            - name: Perf (head)
              run: |
                  npm run build:perf
                  npm run perf:run

            - name: Summary
              if: ${{ !cancelled() }}
              run: |
                  if [ -f perf-base/summary.json ]; then
                      npm run --silent perf:compare -- perf-base/summary.json perf-results/summary.json >> "$GITHUB_STEP_SUMMARY"
                  elif [ -f perf-results/summary.json ]; then
                      npm run --silent perf:compare -- perf-results/summary.json >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: perf-results-${{ github.event_name == 'schedule' && 'nightly' || github.run_id }}
                  path: |
                      perf-results/
                      perf-base/
                  retention-days: 30
