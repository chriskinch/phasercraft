# Automated bug-fix agent.
# Triggers only when the 'bug' label is added to an issue. Removing and
# re-adding the label starts a fresh Copilot session.
# The issue is handed to the Copilot coding agent, which reads the issue,
# assesses confidence, and opens a PR if it is confident it can fix the bug.
name: Bug Fix Agent

on:
    issues:
        types: [labeled]

concurrency:
    group: bug-fix-agent-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    bug-fix:
        # Only run when the label just added is 'bug'
        if: github.event.label.name == 'bug'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write

        steps:
            # There is no published action that runs the Copilot coding agent.
            # The supported trigger is assigning the issue to the Copilot bot,
            # which is done here through the GraphQL API.
            - name: Hand the issue to the Copilot coding agent
              uses: actions/github-script@v7
              env:
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
              with:
                  github-token: ${{ secrets.COPILOT_AGENT_TOKEN || secrets.GITHUB_TOKEN }}
                  script: |
                      const issueNumber = Number(process.env.ISSUE_NUMBER);
                      const { owner, repo } = context.repo;

                      const { repository } = await github.graphql(
                        `query($owner: String!, $repo: String!, $issueNumber: Int!) {
                           repository(owner: $owner, name: $repo) {
                             issue(number: $issueNumber) { id }
                             suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                               nodes { login ... on Bot { id } ... on User { id } }
                             }
                           }
                         }`,
                        { owner, repo, issueNumber }
                      );

                      const copilotLogins = new Set(['copilot-swe-agent', 'copilot']);
                      const copilot = repository.suggestedActors.nodes.find(
                        (node) => copilotLogins.has(node.login.toLowerCase())
                      );

                      if (!copilot) {
                        core.setFailed(
                          'The Copilot coding agent is not available as an assignee for this repository. ' +
                            'Enable Copilot coding agent, and provide a COPILOT_AGENT_TOKEN secret with a ' +
                            'personal access token that has permission to assign it.'
                        );
                        return;
                      }

                      const replaceActors = (actorIds) =>
                        github.graphql(
                          `mutation($assignableId: ID!, $actorIds: [ID!]!) {
                             replaceActorsForAssignable(input: { assignableId: $assignableId, actorIds: $actorIds }) {
                               assignable { ... on Issue { number } }
                             }
                           }`,
                          { assignableId: repository.issue.id, actorIds }
                        );

                      // Re-assigning an existing assignee is a no-op, so clear first to
                      // guarantee a new Copilot session when the label is re-added.
                      const assignees = context.payload.issue.assignees.map((a) => a.login);
                      if (assignees.some((login) => login === 'Copilot' || login === 'copilot-swe-agent')) {
                        await replaceActors([]);
                      }
                      await replaceActors([copilot.id]);

                      await github.rest.issues.createComment({
                        owner,
                        repo,
                        issue_number: issueNumber,
                        body: [
                          'Assigned to the Copilot coding agent by the Bug Fix Agent workflow.',
                          '',
                          'Follow the instructions in `.github/copilot/bug-fix-agent.md` before doing anything.',
                        ].join('\n'),
                      });
